[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "website-monitoring-automation"
version = "1.0.0"
description = "Async, production-grade website / API / SSL / DNS / port monitoring platform with alerting, reporting and a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]
keywords = [
    "monitoring",
    "uptime",
    "sre",
    "devops",
    "ssl",
    "dns",
    "observability",
    "healthcheck",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "rich>=13.0",
    "cryptography>=41.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]
pdf = ["reportlab>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML>=6.0",
]

[project.scripts]
webmon = "webmon.cli:main"

[project.urls]
Homepage = "https://github.com/mojtaba-py-code/website-monitoring-automation"
Repository = "https://github.com/mojtaba-py-code/website-monitoring-automation"
Issues = "https://github.com/mojtaba-py-code/website-monitoring-automation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webmon = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests spanning multiple modules",
    "network: tests that would touch the network (mocked by default)",
    "slow: slower tests",
]

[tool.coverage.run]
branch = true
source = ["webmon"]
omit = ["*/web/*", "*/alerting/channels.py", "*/metrics.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# "S" is flake8-bandit: security linting is a permanent gate, not a one-off audit.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "ASYNC", "RUF", "S"]
ignore = ["N818", "SIM112"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), carry dummy tokens (S105/S106), and name "0.0.0.0" (S104)
# precisely to prove the server REFUSES that bind without a token.
"tests/*" = ["S101", "S104", "S105", "S106", "E501", "RUF059"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["webmon"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
