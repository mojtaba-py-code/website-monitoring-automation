name: Publish

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect): GitHub mints a
# short-lived identity token for this exact workflow, and PyPI exchanges it for
# a one-off upload credential. No API token or password is stored anywhere --
# not in the repository, not in Actions secrets, not on a developer's machine.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Confirm the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag ($tag) does not match project.version ($version)."
            exit 1
          fi
          echo "Version $version matches tag $tag."

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment registered with the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/website-monitoring-automation
    permissions:
      # Required for Trusted Publishing: lets the job request an OIDC token.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
